<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disponibilité 🗓</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Choisis une disponibilité pour se voir</h1>
      <div
        class="tenor-gif-embed"
        data-postid="19414919"
        data-share-method="host"
        data-aspect-ratio="1"
        data-width="100%"
      >
        <a
          href="https://tenor.com/view/puglie-pug-puglie-pug-dog-puppy-gif-19414919"
          >Puglie Pug Puglie GIF</a
        >from
        <a href="https://tenor.com/search/puglie+pug-gifs">Puglie Pug GIFs</a>
      </div>
      <script
        type="text/javascript"
        async
        src="https://tenor.com/embed.js"
      ></script>

      <div class="date-container">
        <label for="availability"></label
        ><br /><br />
        <input
          type="date"
          id="availability"
          name="availability"
          value="2026-07-12"
        />
      </div>

      <div
        id="confirmationMessage"
        style="display: none; color: green; margin-top: 15px"
      >
        Merci ! La date a bien été enregistrée.
      </div>

      <div class="selection-buttons">
        <button id="selectButton">Sélectionner</button>
      </div>

    </div>

    <script src="../script/notif.js"></script>
    <script>
      let selectedDate = document.getElementById("availability").value;

      document
        .getElementById("availability")
        .addEventListener("change", (event) => {
          selectedDate = event.target.value;
        });

      document.getElementById("selectButton").addEventListener("click", () => {
        if (selectedDate) {
          const message = `Réponse reçue de la date choisie : ${selectedDate}`;

          sendToDiscord(message);
          window.location.href = "menu.html";
        }
      });
    </script>
  </body>
</html>
