<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oui 🎆</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Choisis ce que tu veux manger</h1>

      <div class="image-container">
        <div class="meal-option">
          <img src="../images/italie.png" alt="Italien" data-meal="Italien" />
          <p>Italien</p>
        </div>
        <div class="meal-option">
          <img src="../images/japan.webp" alt="Japonais" data-meal="Japonais" />
          <p>Japonais</p>
        </div>
      </div>
      <div class="image-container">
        <div class="meal-option">
          <img src="../images/china.webp" alt="Chinois" data-meal="Chinois" />
          <p>Chinois</p>
        </div>
        <div class="meal-option">
          <img
            src="../images/france.webp"
            alt="Français"
            data-meal="Français"
          />
          <p>Français</p>
        </div>
      </div>

      <div class="image-container">
        <div class="meal-option">
          <img src="../images/coreen.png" alt="Coréen" data-meal="Coréen" />
          <p>Coréen</p>
        </div>
        <div class="meal-option">
          <button id="suggestionButton">Ta propre suggestion (Tiramisu, coffee shop, BBT, moi)</button>
        </div>
      </div>

      <div
        id="confirmationMessage"
        style="display: none; color: green; margin-top: 15px"
      >
        Merci ! Ce que tu veux manger a bien été enregistré.
      </div>

      <div class="selection-buttons">
        <button id="selectButton" disabled>Sélectionner</button>
      </div>

    </div>

    <script src="../script/notif.js"></script>
    <script>
      let selectedMeal = null;

      document.querySelectorAll(".meal-option img").forEach((img) => {
        img.addEventListener("click", () => {
          document
            .querySelectorAll(".meal-option img")
            .forEach((i) => i.classList.remove("selected"));
          img.classList.add("selected");

          selectedMeal = img.dataset.meal;
          document.getElementById("selectButton").disabled = false;
        });
      });

      document.getElementById("selectButton").addEventListener("click", () => {
        if (selectedMeal) {
          const message = `Réponse reçue de la question 1: ${selectedMeal}`;
          sendToDiscord(message);
          window.location.href = "activite.html";
        }
      });

      function askQuestion(redirectUrl = "thanks.html") {
        const mealChoice = prompt("Qu'est-ce que tu veux manger ?");

        if (mealChoice && mealChoice.trim()) {
          const message = `Réponse reçue : Repas choisi : ${mealChoice}`;
          sendToDiscord(message);
          window.location.href = redirectUrl;
        }
      }

      const choice = document.querySelector("#suggestionButton");
      if (choice) {
        choice.addEventListener("click", () => {
          askQuestion("activite.html");
        });
      }
    </script>
  </body>
</html>
